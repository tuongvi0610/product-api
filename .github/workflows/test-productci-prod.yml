name: Production CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cài đặt toàn bộ dependencies
        run: npm ci

      - name: Chạy toàn bộ integration tests
        env:
          PORT: 3000
        run: npm test

  cd-dockerhub:
    needs: test-and-verify
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

  deploy-local:
    needs: cd-dockerhub
    runs-on: self-hosted
    steps:
      - name: Kéo image mới nhất từ Docker Hub về Local
        run: |
          docker compose -f docker-compose-prod.yaml pull

      - name: Khởi động container phiên bản mới
        run: |
          docker compose -f docker-compose-prod.yaml up -d --remove-orphans