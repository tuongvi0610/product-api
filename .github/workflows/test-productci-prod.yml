name: Production CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          
      - name: Khởi động MongoDB Container
        run: docker run -d --name test-mongo -p 27017:27017 mongo:6.0
        
      - name: Chờ MongoDB sẵn sàng
        run: sleep 15

      - name: Cài đặt toàn bộ dependencies
        run: npm ci

      - name: Chạy toàn bộ integration tests CRUD với MongoDB
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/product_test_db
        run: npm test

  cd-dockerhub:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

  deploy-local:
    needs: cd-dockerhub
    runs-on: self-hosted
    steps:
      - name: Kéo image mới nhất từ Docker Hub về Local
        run: |
          docker compose -f docker-compose-prod.yaml pull

      - name: Khởi động container phiên bản mới
        run: |
          docker compose -f docker-compose-prod.yaml up -d --remove-orphans