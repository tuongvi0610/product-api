name: Production CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ==========================================
  # JOB 1: TEST
  # ==========================================
  test-and-verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cài đặt toàn bộ dependencies
        run: npm ci

      - name: Chạy toàn bộ integration tests
        env:
          PORT: 3000
          MONGOMS_DOWNLOAD_MIRROR: https://fastdl.mongodb.org/linux
          MONGOMS_PREFER_GLOBAL_PATH: 1
        run: npm test


  # ==========================================
  # JOB 2: BUILD + PUSH DOCKER HUB
  # ==========================================
  cd-dockerhub:
    needs: test-and-verify
    runs-on: ubuntu-22.04

    # Chỉ build/push khi push code,
    # không chạy khi Pull Request
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}


  # ==========================================
  # JOB 3: DEPLOY LOCAL
  # ==========================================
  deploy-local:
    needs: cd-dockerhub
    runs-on: self-hosted

    # Chỉ deploy khi push lên repository
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kiểm tra Docker
        run: |
          docker --version
          docker info

      - name: Kéo image mới nhất từ Docker Hub về Local
        run: |
          docker compose -f docker-compose-prod.yaml pull

      - name: Khởi động container phiên bản mới
        run: |
          docker compose -f docker-compose-prod.yaml up -d --remove-orphans