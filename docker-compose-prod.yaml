version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nammongodb-prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - product-prod-network

  product-api:
    image: tuongvi6105/product-api:latest
    container_name: product-api-prod
    restart: always
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - product-prod-network

volumes:
  mongo_data_prod:

networks:
  product-prod-network:
    driver: bridge